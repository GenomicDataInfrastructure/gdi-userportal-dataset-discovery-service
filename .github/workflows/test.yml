name: Run Tests

on: push

permissions: {}

env:
  # ART-31067 / CVE-2026-114938: protect Maven, tests and the native-image build JVM.
  JAVA_TOOL_OPTIONS: "-XX:-UseBASE64Intrinsics"

jobs:
  test:
    runs-on: ubuntu-latest
    environment: sonarcloud
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          java-version: "25"
      - name: Verify Java4Shell mitigation
        run: |
          java -XX:+PrintFlagsFinal -version > java-flags.txt 2>&1
          grep -Eq 'UseBASE64Intrinsics[[:space:]]*=[[:space:]]*false' java-flags.txt
          rm java-flags.txt
      - name: run tests
        run: mvn --batch-mode --update-snapshots verify formatter:validate
      - name: run sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.coverage.jacoco.xmlReportPaths=./target/jacoco-report/jacoco.xml -Dsonar.organization=genomicdatainfrastructure -Dsonar.projectKey=GenomicDataInfrastructure_gdi-userportal-dataset-discovery-service
  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
